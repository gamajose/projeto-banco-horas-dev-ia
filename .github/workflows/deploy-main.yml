name: Deploy Banco de Horas

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: banco-horas-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    name: Atualizar servidor local
    runs-on:
      - self-hosted
      - linux
      - banco-horas
    timeout-minutes: 15

    steps:
      - name: Atualizar, validar e publicar
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT_DIR="/mnt/Projetos/banco-horas-red-prod"
          HEALTH_URL="http://localhost:8000/health"

          exec 9>/tmp/banco-horas-deploy.lock
          flock -n 9 || {
            echo "Outro deploy do Banco de Horas já está em execução."
            exit 1
          }

          git config --global --add safe.directory "$PROJECT_DIR"
          cd "$PROJECT_DIR"

          test -f .env.production || {
            echo "Crie $PROJECT_DIR/.env.production antes do primeiro deploy."
            exit 1
          }

          DIRTY_FILES="$(git status --porcelain --untracked-files=all | grep -Ev '^.. (\.env|\.env\.production|logs/)' || true)"
          if [ -n "$DIRTY_FILES" ]; then
            echo "A cópia de produção possui alterações locais. O deploy foi interrompido."
            echo "$DIRTY_FILES"
            exit 1
          fi

          ENV_BACKUP="$(mktemp)"
          trap 'rm -f "$ENV_BACKUP"' EXIT
          cp .env.production "$ENV_BACKUP"

          git fetch --prune origin main
          git checkout main
          git reset --hard origin/main
          install -m 600 "$ENV_BACKUP" .env.production

          npm ci
          npm test
          npm run build
          mkdir -p logs
          npx pm2 startOrReload ecosystem.config.js --env production --update-env
          npx pm2 save

          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "$HEALTH_URL"; then
              echo
              echo "Deploy concluído no commit $(git rev-parse --short HEAD)."
              npx pm2 status banco-de-horas
              exit 0
            fi
            echo "Aplicação ainda não respondeu; nova tentativa em 2 segundos ($attempt/5)."
            sleep 2
          done

          echo "A aplicação não respondeu ao health check."
          npx pm2 logs banco-de-horas --lines 100 --nostream || true
          exit 1
